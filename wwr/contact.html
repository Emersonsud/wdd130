<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting Company</title>
    <meta name="description" content="Discover the history, mission, and values of our white-water rafting company. Come and adventure with us!">
    <meta name="author" content="Emerson Dos Santos">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="contact">

    <header>
        <img src="images/logo.jpg" alt="Rafting Company Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <!-- Main Content of the Contact Page -->
    <main>
        <!-- Section 1: Company Information -->
        <section class="company-info">
            <h1>Rafting Travels Company</h1>
            <p>268 Lakeshore Rd, Boulder City</p>
            <p>NV 89005, USA</p>
            <p>+1(800)455-3490</p>
            <p>Hooverdamraftingadventures@gmail.com</p>
        </section>
        <!-- Section 2: Map and Form Side by Side -->
        <div class="contact-container">
            <!-- Embedded Map (Iframe without inline styling, as required) -->
            <div class="map-box">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d51642.60729952301!2d-114.8670485672639!3d36.00410110594179!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c92c712a6565bd%3A0x91d459162756f8a4!2sHoover%20Dam%20Rafting%20Adventures!5e0!3m2!1spt-BR!2sus!4v1785403773422!5m2!1spt-BR!2sus" 
                        width="600" 
                        height="450" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

            <!-- Contact Form -->
            <form action="" method="post"> 
    <div class="name"> 
        <label for="name">Name</label> 
        <input type="text" id="name" name="user_name" placeholder="Name" required> 
    </div> 
    <div class="email"> 
        <label for="email">Email</label> 
        <input type="email" id="email" name="user_email" placeholder="Email" required> 
    </div> 
    
    <fieldset> 
        <legend>Message Purpose</legend> 
        <div class="message"> 
            <div class="messagelist"> 
                <!-- Adicionados IDs únicos para cada rádio button -->
                <label><input type="radio" id="purpose-general" name="purpose" value="general" checked> General Inquiry</label> 
                <label><input type="radio" id="purpose-reservation" name="purpose" value="reservation"> Reservation Question</label> 
                <label><input type="radio" id="purpose-suggestion" name="purpose" value="suggestion"> Website Suggestion</label> 
            </div> 
        </div> 
    </fieldset> 

    <label for="message">Message</label> 
    <textarea id="message" name="user_message" placeholder="Type here" required></textarea> 
    
    <div class="checkbox-group"> 
        <input type="checkbox" id="newsletter" name="subscribe" checked> 
        <label for="newsletter">Please subscribe me to the monthly newsletter</label> 
    </div> 
    
    <!-- Adicionado o atributo type="submit" exigido -->
    <button type="submit" class="submit">Get in Touch!</button> 
</form>

        </div>

        <!-- Section 3: Employee Profiles -->
        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-container">
                <figure class="employee-card">
                    <img class="photo-placeholder" src="images/employee1.jpg" alt="Foto de Perfil do Funcionário 1">
                    <figcaption>Reservation Coordinator</figcaption>
                </figure>

                <figure class="employee-card">
                    <img class="photo-placeholder" src="images/employee2.jpg" alt="Foto de Perfil do Funcionário 2">
                    <figcaption>Safety Officer</figcaption>
                </figure>

                <figure class="employee-card">
                    <img class="photo-placeholder" src="images/employee3.jpg" alt="Foto de Perfil do Funcionário 3">
                    <figcaption>Senior Rafting Guide</figcaption>
                </figure>
            </div>
        </section>
    </main>

   <footer> 
    <!-- Left empty block to balance the flexbox spacing --> 
    <div></div> 
    <!-- Centered copyright text --> 
    <p>© 2026 Rafting Travels Company | Emerson Dos Santos</p> 
    <!-- Right-aligned social media links inside nav --> 
    <nav class="socialmedia"> 
        <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook"></a> 
        <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn"></a> 
        <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a> 
    </nav> 
</footer>


</body>
</html>
